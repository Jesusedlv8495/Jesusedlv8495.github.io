<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto — Jesús de León</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .contact-page {
      max-width: 560px;
      margin: 4rem auto;
      padding: 0 2rem;
    }
    .contact-page h2 {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #888;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 0.4rem;
      margin-bottom: 2rem;
    }
    .contact-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.1rem 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .contact-row .contact-icon {
      font-size: 1.2rem;
      width: 2rem;
      text-align: center;
      flex-shrink: 0;
    }
    .contact-row .contact-info { line-height: 1.4; }
    .contact-row .contact-type {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #999;
      display: block;
      margin-bottom: 0.15rem;
    }
    .contact-row a {
      font-family: var(--font-sans);
      font-size: 0.97rem;
      color: var(--black);
      text-decoration: none;
      transition: color 0.2s;
    }
    .contact-row a:hover { color: var(--accent); }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <h1>Jesús de León</h1>
      <span class="tagline">Periodista y Analista</span>
    </div>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="index.html#articulos">Artículos</a></li>
      <li><a href="about.html">Sobre mí</a></li>
      <li><a href="contact.html" target="_blank">Contacto</a></li>
    </ul>
  </nav>

  <div class="article-page-header">
    <div class="article-page-header-inner">
      <a href="index.html" class="back-link">← Volver al inicio</a>
      <h1>Contacto</h1>
    </div>
  </div>

  <div class="contact-page">
    <h2>Escríbeme o sígueme</h2>

    <div class="contact-row">
      <div class="contact-icon">📞</div>
      <div class="contact-info">
        <span class="contact-type">Teléfono</span>
        <a href="tel:3043836074">304 383 6074</a>
      </div>
    </div>

    <div class="contact-row">
      <div class="contact-icon">✉️</div>
      <div class="contact-info">
        <span class="contact-type">Correo</span>
        <a href="mailto:jesu8495@gmail.com">jesu8495@gmail.com</a>
      </div>
    </div>

    <div class="contact-row">
      <div class="contact-icon">𝕏</div>
      <div class="contact-info">
        <span class="contact-type">X (Twitter)</span>
        <a href="https://twitter.com/jesusedlv" target="_blank" rel="noopener">@jesusedlv</a>
      </div>
    </div>

    <div class="contact-row">
      <div class="contact-icon">📷</div>
      <div class="contact-info">
        <span class="contact-type">Instagram</span>
        <a href="https://instagram.com/jesusedlv" target="_blank" rel="noopener">@jesusedlv</a>
      </div>
    </div>
  </div>

  <footer>
    &copy; <span id="year"></span> Jesús de León &nbsp;·&nbsp; Todos los derechos reservados
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
